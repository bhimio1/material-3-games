[package]
name = "material_3_games"
version = "0.1.0"
edition = "2021"
description = "A Material 3 game manager with a gamescope Game Mode, built with egui"
license = "MIT"

[[bin]]
name = "m3-games"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence"] }
egui = "0.37"
egui_material_icons = { version = "0.9", features = ["filled", "outline"] }
material-colors = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico"] }
ureq = { version = "2.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
gilrs = "0.11"
notify = "6"
flume = "0.11"
lru = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
dirs = "6"
anyhow = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
